[project]
name = "ubuntu-cast"
version = "0.1.0"
description = "Cast your Ubuntu desktop (screen + audio) to a Chromecast from the terminal"
readme = "README.md"
authors = [
    { name = "Jerry van Heerikhuize", email = "jvanheerikhuize@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jeepney>=0.9.0",
    "pychromecast>=14.0.10",
    "rich>=15.0.0",
    "typer>=0.27.0",
]

[project.scripts]
ubuntu-cast = "ubuntu_cast.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
